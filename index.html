
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>통합 대시보드</title>
<style>
body{margin:0;background:#111;font-family:Arial,sans-serif}
.header{padding:8px 12px;background:#1b1b1b;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:10;flex-wrap:wrap;min-height:52px}
.tab-btn{padding:8px 14px;cursor:pointer;background:#252a38;color:#9ca3af;border:1px solid #333;border-radius:6px;font-size:13px;font-family:inherit;transition:all .2s}
.tab-btn:hover{background:#2d3347;color:#e8eaf2}
iframe{width:100%;height:calc(100vh - 52px);border:none;display:none}
iframe.active{display:block}

/* ── CSV Upload ── */
.upload-zone{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#csvFileInput{display:none}
.upload-btn{
  display:flex;align-items:center;gap:6px;
  padding:7px 14px;
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  color:#fff;border:none;border-radius:7px;cursor:pointer;
  font-size:12px;font-family:inherit;font-weight:600;
  transition:opacity .2s;white-space:nowrap;
  box-shadow:0 2px 8px rgba(79,70,229,.3)
}
.upload-btn:hover{opacity:.88}
.upload-status{font-size:11px;color:#6b7280;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upload-status.ok{color:#4fcea4}
.upload-status.err{color:#f76f4f}
.upload-status.loading{color:#f7c74f}

/* CSV column mapping modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);
  display:none;align-items:center;justify-content:center;z-index:9999
}
.modal-overlay.visible{display:flex}
.modal{
  background:#13161e;border:1px solid #252a38;border-radius:14px;
  padding:28px;max-width:640px;width:90%;max-height:80vh;overflow-y:auto
}
.modal-title{font-size:15px;font-weight:700;color:#e8eaf2;margin-bottom:6px}
.modal-sub{font-size:12px;color:#6b7280;margin-bottom:20px}
.col-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.col-row{display:flex;flex-direction:column;gap:4px}
.col-label{font-size:11px;color:#9ca3af;text-transform:uppercase;letter-spacing:.06em}
.col-select{
  background:#1a1e2a;border:1px solid #252a38;color:#e8eaf2;
  border-radius:6px;padding:7px 10px;font-size:12px;font-family:inherit;outline:none
}
.col-select:focus{border-color:#4f8ef7}
.col-select.required-missing{border-color:#f76f4f}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
.modal-btn{padding:8px 18px;border-radius:7px;font-size:12px;font-family:inherit;cursor:pointer;font-weight:600}
.modal-btn.cancel{background:transparent;border:1px solid #252a38;color:#9ca3af}
.modal-btn.cancel:hover{border-color:#4f8ef7;color:#4f8ef7}
.modal-btn.apply{background:#4f8ef7;border:none;color:#fff}
.modal-btn.apply:hover{background:#3b7de8}

/* Loading overlay */
.loading-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:9998
}
.loading-overlay.visible{display:flex}
.spinner{width:38px;height:38px;border:3px solid #252a38;border-top-color:#4f8ef7;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:#e8eaf2;font-size:13px}
</style>
</head>
<body>

<div class="header">
  <button class="tab-btn" onclick="showTab('crm')">CRM 대시보드</button>
  <button class="tab-btn" onclick="showTab('detail')">유입 상세 대시보드</button>

  <div class="upload-zone">
    <input type="file" id="csvFileInput" accept=".csv" onchange="onFileSelected(this)">
    <button class="upload-btn" onclick="document.getElementById('csvFileInput').click()">
      📂 CSV 업로드
    </button>
    <span class="upload-status" id="uploadStatus">CSV 파일을 업로드하면 대시보드가 업데이트됩니다</span>
  </div>
</div>

<!-- Column mapping modal -->
<div class="modal-overlay" id="mappingModal">
  <div class="modal">
    <div class="modal-title">📋 컬럼 매핑 설정</div>
    <div class="modal-sub">CSV 헤더를 대시보드 컬럼에 연결해주세요. <span style="color:#f76f4f">*필수</span></div>
    <div class="col-grid" id="mappingGrid"></div>
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeMapping()">취소</button>
      <button class="modal-btn apply" onclick="applyMapping()">적용 ▶</button>
    </div>
  </div>
</div>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">처리 중...</div>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     CRM 대시보드 iframe
     RAW_DATA는 빈 배열로 시작 → postMessage('CRM_DATA')로 채워짐
     COL 인덱스: date=0, path2=1, campaign=2, sess=3, pdp=4,
                 cart=5, checkout=6, orders=7, revenue=8, aov=9
     ═══════════════════════════════════════════════════════════════ -->
<iframe id="crm" class="active" srcdoc="<!DOCTYPE html>
<html lang=&quot;ko&quot;>
<head>
<meta charset=&quot;UTF-8&quot;>
<meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>
<title>CRM 성과 대시보드</title>
<link rel=&quot;preconnect&quot; href=&quot;https://fonts.googleapis.com&quot;>
<link href=&quot;https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&amp;family=Space+Mono:wght@400;700&amp;display=swap&quot; rel=&quot;stylesheet&quot;>
<script src=&quot;https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js&quot;>&lt;/script>
<style>
  :root {
    --bg: #0d0f14; --surface: #13161e; --surface2: #1a1e2a; --border: #252a38;
    --accent: #4f8ef7; --accent2: #7c5cfc; --accent3: #f76f4f; --accent4: #4fcea4;
    --accent5: #f7c74f; --text: #e8eaf2; --text-muted: #6b7280; --text-dim: #9ca3af;
    --glow: rgba(79,142,247,0.15);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'Noto Sans KR',sans-serif; font-size:13px; min-height:100vh; }
  .header { background:linear-gradient(135deg,#0d0f14 0%,#131726 100%); border-bottom:1px solid var(--border); padding:16px 28px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; backdrop-filter:blur(12px); }
  .header-left { display:flex; align-items:center; gap:12px; }
  .logo-dot { width:10px; height:10px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px var(--accent); animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  .header-title { font-family:'Space Mono',monospace; font-size:14px; color:var(--text); letter-spacing:.05em; }
  .header-sub { color:var(--text-muted); font-size:11px; margin-top:2px; }
  .main { padding:20px 28px; max-width:1600px; margin:0 auto; }
  .date-filter-bar { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px 20px; margin-bottom:20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }

  .preset-btn { padding:6px 13px; border:1px solid var(--border); background:var(--surface2); color:var(--text-dim); border-radius:20px; cursor:pointer; font-size:11px; font-family:'Noto Sans KR',sans-serif; transition:all .2s; white-space:nowrap; }
  .preset-btn:hover { border-color:var(--accent); color:var(--accent); }
  .preset-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 0 16px rgba(79,142,247,.3); }
  .apply-btn { padding:8px 18px; border:none; background:var(--accent); color:#fff; border-radius:8px; cursor:pointer; font-size:12px; font-family:'Noto Sans KR',sans-serif; font-weight:500; transition:all .2s; box-shadow:0 0 12px rgba(79,142,247,.25); }
  .apply-btn:hover { transform:translateY(-1px); box-shadow:0 4px 20px rgba(79,142,247,.4); }
  .comp-banner { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:20px; }
  .comp-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
  .comp-card-title { font-size:10px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.07em; margin-bottom:8px; }
  .comp-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:5px; }
  .comp-period-label { font-size:10px; color:var(--text-muted); }
  .comp-value { font-family:'Space Mono',monospace; font-size:12px; color:var(--text); }
  .comp-delta { font-size:11px; font-weight:600; }
  .delta-up { color:#4fcea4; } .delta-down { color:#f76f4f; } .delta-flat { color:var(--text-muted); }
  .metric-bar { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:20px; }
  .metric-btn { padding:6px 13px; border:1px solid var(--border); background:var(--surface); color:var(--text-dim); border-radius:20px; cursor:pointer; font-size:11px; font-family:'Noto Sans KR',sans-serif; transition:all .2s; white-space:nowrap; }
  .metric-btn:hover { border-color:var(--accent); color:var(--accent); }
  .metric-btn.active { background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 0 16px rgba(79,142,247,.3); }
  .stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
  .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 20px; position:relative; overflow:hidden; transition:border-color .2s; }
  .stat-card::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--card-accent,var(--accent)); }
  .stat-card:hover { border-color:var(--card-accent,var(--accent)); }

  .chart-title { font-size:13px; font-weight:500; color:var(--text); }

  .chart-tag { font-size:9px; padding:3px 8px; border-radius:10px; background:var(--glow); color:var(--accent); border:1px solid rgba(79,142,247,.2); font-family:'Space Mono',monospace; }
  .chart-wrap { position:relative; height:260px; }
  .chart-wrap.tall { height:320px; }
  .drilldown-panel { background:var(--surface); border:1px solid var(--accent); border-radius:14px; padding:20px; margin-bottom:20px; box-shadow:0 0 32px rgba(79,142,247,.08); display:none; }
  .drilldown-panel.visible { display:block; }
  .drilldown-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }

  .close-btn:hover { color:var(--text); border-color:var(--accent3); }

  .rank-1{background:rgba(247,199,79,.2);color:#f7c74f;} .rank-2{background:rgba(156,163,175,.2);color:#9ca3af;} .rank-3{background:rgba(247,111,79,.2);color:#f76f4f;} .rank-n{background:var(--surface2);color:var(--text-muted);}
  .bar-inline { display:flex; align-items:center; gap:8px; }

  .empty-state .msg { font-size:15px; }
  .empty-state .sub { font-size:12px; color:var(--text-muted); }
  @media (max-width:900px) { .main{padding:12px;} .stat-grid{grid-template-columns:repeat(2,1fr);} .charts-grid{grid-template-columns:1fr;} .charts-grid .chart-card.full{grid-column:1;} .comp-banner{grid-template-columns:repeat(2,1fr);} }
</style>
</head>
<body>

<div class=&quot;header&quot;>
  <div class=&quot;header-left&quot;>
    <div class=&quot;logo-dot&quot;></div>
    <div>
      <div class=&quot;header-title&quot;>CRM ANALYTICS</div>
      <div class=&quot;header-sub&quot; id=&quot;headerSub&quot;>CSV를 업로드해주세요</div>
    </div>
  </div>
  <div style=&quot;display:flex;align-items:center;gap:12px;&quot;>
    <div style=&quot;font-size:10px;color:var(--text-muted);font-family:'Space Mono',monospace;&quot; id=&quot;breadcrumb&quot;>전체 채널</div>
  </div>
</div>

<div class=&quot;main&quot;>
  <!-- DATE FILTER BAR -->
  <div class=&quot;date-filter-bar&quot;>
    <div class=&quot;date-filter-group&quot;>
      <div class=&quot;date-filter-label&quot;>조회 기간</div>
      <div class=&quot;date-inputs&quot;>
        <input type=&quot;date&quot; id=&quot;dateFrom&quot; class=&quot;date-input&quot;>
        <span class=&quot;date-sep&quot;>~</span>
        <input type=&quot;date&quot; id=&quot;dateTo&quot; class=&quot;date-input&quot;>
        <button class=&quot;apply-btn&quot; onclick=&quot;applyDateFilter()&quot;>적용</button>
      </div>
    </div>
    <div class=&quot;date-filter-group&quot;>
      <div class=&quot;date-filter-label&quot;>빠른 선택</div>
      <div class=&quot;preset-btns&quot; id=&quot;presetBtns&quot;>
        <button class=&quot;preset-btn&quot; onclick=&quot;setPreset('mtd')&quot; id=&quot;preset-mtd&quot;>이번달</button>
        <button class=&quot;preset-btn&quot; onclick=&quot;setPreset('last7')&quot; id=&quot;preset-last7&quot;>최근 7일</button>
        <button class=&quot;preset-btn&quot; onclick=&quot;setPreset('last30')&quot; id=&quot;preset-last30&quot;>최근 30일</button>
        <button class=&quot;preset-btn&quot; onclick=&quot;setPreset('prevMonth')&quot; id=&quot;preset-prevMonth&quot;>전월</button>
        <button class=&quot;preset-btn&quot; onclick=&quot;setPreset('all')&quot; id=&quot;preset-all&quot;>전체</button>
      </div>
    </div>
    <div style=&quot;margin-left:auto;display:flex;flex-direction:column;gap:5px;&quot;>
      <div class=&quot;date-filter-label&quot;>비교 기준</div>
      <div style=&quot;display:flex;gap:6px;&quot;>
        <button class=&quot;preset-btn&quot; id=&quot;cmp-mom&quot; onclick=&quot;setCompareMode('mom')&quot;>전월 동기간</button>
        <button class=&quot;preset-btn&quot; id=&quot;cmp-wow&quot; onclick=&quot;setCompareMode('wow')&quot;>전주 동기간</button>
        <button class=&quot;preset-btn active&quot; id=&quot;cmp-none&quot; onclick=&quot;setCompareMode('none')&quot;>비교 없음</button>
      </div>
    </div>
  </div>

  <div class=&quot;comp-banner&quot; id=&quot;compBanner&quot; style=&quot;display:none;&quot;></div>
  <div class=&quot;metric-bar&quot; id=&quot;metricBar&quot;></div>
  <div class=&quot;stat-grid&quot; id=&quot;statGrid&quot;></div>

  <!-- Empty state shown before data is loaded -->
  <div id=&quot;emptyState&quot; class=&quot;empty-state&quot;>
    <div class=&quot;icon&quot;>📂</div>
    <div class=&quot;msg&quot;>상단의 <strong>CSV 업로드</strong> 버튼으로 데이터를 불러오세요</div>
    <div class=&quot;sub&quot;>필요 컬럼: 날짜, 채널(path2), 캠페인, 세션수, 상품상세세션수, 장바구니세션수, 체크아웃세션수, 주문수, 주문금액, 평균주문금액</div>
  </div>

  <!-- Main content (hidden until data loaded) -->
  <div id=&quot;mainContent&quot; style=&quot;display:none&quot;>
    <div class=&quot;drilldown-panel&quot; id=&quot;drillPanel&quot;>
      <div class=&quot;drilldown-header&quot;>
        <div>
          <div class=&quot;drilldown-title&quot; id=&quot;drillTitle&quot;>드릴다운</div>
          <div style=&quot;font-size:11px;color:var(--text-muted);margin-top:4px;&quot; id=&quot;drillSub&quot;></div>
        </div>
        <button class=&quot;close-btn&quot; onclick=&quot;closeDrill()&quot;>✕</button>
      </div>
      <div style=&quot;display:grid;grid-template-columns:1fr 1fr;gap:16px;&quot;>
        <div class=&quot;chart-wrap tall&quot; id=&quot;drillChartWrap&quot;><canvas id=&quot;drillChart&quot;></canvas></div>
        <div class=&quot;table-wrap&quot; id=&quot;drillTable&quot;></div>
      </div>
    </div>

    <div class=&quot;charts-grid&quot;>
      <div class=&quot;chart-card full&quot;>
        <div class=&quot;chart-header&quot;>
          <div><div class=&quot;chart-title&quot;>채널별 성과 비교</div><div class=&quot;chart-subtitle&quot;>막대 클릭 시 캠페인별 드릴다운</div></div>
          <div class=&quot;chart-tag&quot;>BAR · DRILLDOWN</div>
        </div>
        <div class=&quot;chart-wrap tall&quot;><canvas id=&quot;mainBarChart&quot;></canvas></div>
      </div>
      <div class=&quot;chart-card&quot;>
        <div class=&quot;chart-header&quot;>
          <div><div class=&quot;chart-title&quot;>채널별 주문금액 비중</div><div class=&quot;chart-subtitle&quot;>선택 기간 기준</div></div>
          <div class=&quot;chart-tag&quot;>PIE</div>
        </div>
        <div class=&quot;chart-wrap&quot;><canvas id=&quot;pieChart&quot;></canvas></div>
      </div>
      <div class=&quot;chart-card&quot;>
        <div class=&quot;chart-header&quot;>
          <div><div class=&quot;chart-title&quot;>전환율 분포</div><div class=&quot;chart-subtitle&quot;>유입比 vs 상세比 주문전환율</div></div>
          <div class=&quot;chart-tag&quot;>SCATTER</div>
        </div>
        <div class=&quot;chart-wrap&quot;><canvas id=&quot;scatterChart&quot;></canvas></div>
      </div>

<script>
// ===== COLUMN INDEX MAP =====
const COL = { date:0, path2:1, campaign:2, sess:3, pdp:4, cart:5, checkout:6, orders:7, revenue:8, aov:9 };

// ===== RAW DATA (populated via postMessage) =====
let RAW_DATA = [];

// ===== CHANNEL META =====
const CHANNEL_COLORS = {'문자메세지':'#4fcea4','카카오 알림톡':'#f7c74f','카카오 친구톡':'#f76f4f','브레이즈 인웹 배너':'#a78bfa'};
const CHANNEL_PILL   = {'문자메세지':'pill-sms','카카오 알림톡':'pill-kakao-at','카카오 친구톡':'pill-kakao-ft','브레이즈 인웹 배너':'pill-banner'};
const DISPLAY_METRICS = ['주문금액','주문수','세션수','유입比 주문전환율','상세比 주문전환율','상품상세전환율','평균주문금액','상품상세세션수','장바구니세션수','체크아웃세션수'];

// ===== STATE =====
let currentMetric = '주문금액';
let currentDateFrom = '';
let currentDateTo = '';
let compareMode = 'none';
let chartInstances = {};
let drillChannel = null;
let selectedCampaigns = new Set();
let funnelSelectedCampaigns = new Set();
let compareCharts = {};
let funnelCharts = {};

// ===== DATE HELPERS =====
function toDateStr(d){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${dd}`;}
function parseDate(s){return new Date(s+'T00:00:00');}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function addMonths(d,n){const r=new Date(d);r.setMonth(r.getMonth()+n);return r;}

function getCompPeriod(from,to){
  if(compareMode==='none')return null;
  const f=parseDate(from),t=parseDate(to);
  if(compareMode==='wow'){return{from:toDateStr(addDays(f,-7)),to:toDateStr(addDays(t,-7))};}
  else{return{from:toDateStr(addMonths(f,-1)),to:toDateStr(addMonths(t,-1))};}
}

function filterByDate(from,to){return RAW_DATA.filter(r=>r[COL.date]>=from&&r[COL.date]<=to);}

function aggregateRows(rows){
  const byKey={};
  for(const r of rows){
    const key=r[COL.path2]+'|||'+r[COL.campaign];
    if(!byKey[key])byKey[key]={path2:r[COL.path2],campaign:r[COL.campaign],세션수:0,상품상세세션수:0,장바구니세션수:0,체크아웃세션수:0,주문수:0,주문금액:0};
    byKey[key].세션수+=r[COL.sess];byKey[key].상품상세세션수+=r[COL.pdp];byKey[key].장바구니세션수+=r[COL.cart];
    byKey[key].체크아웃세션수+=r[COL.checkout];byKey[key].주문수+=r[COL.orders];byKey[key].주문금액+=r[COL.revenue];
  }
  const result=Object.values(byKey);
  for(const c of result){
    c.평균주문금액=c.주문수>0?c.주문금액/c.주문수:0;
    c['유입比 주문전환율']=c.세션수>0?c.주문수/c.세션수:0;
    c['상세比 주문전환율']=c.상품상세세션수>0?c.주문수/c.상품상세세션수:0;
    c.상품상세전환율=c.세션수>0?c.상품상세세션수/c.세션수:0;
  }
  return result;
}

function getAggData(){return aggregateRows(filterByDate(currentDateFrom,currentDateTo));}
function getCompAggData(){const cp=getCompPeriod(currentDateFrom,currentDateTo);if(!cp)return null;return aggregateRows(filterByDate(cp.from,cp.to));}

function sumMetric(campArr,metric){
  if(['유입比 주문전환율','상세比 주문전환율','상품상세전환율','평균주문금액'].includes(metric)){
    let totalOrders=campArr.reduce((s,c)=>s+c.주문수,0),totalSess=campArr.reduce((s,c)=>s+c.세션수,0),
        totalPdp=campArr.reduce((s,c)=>s+c.상품상세세션수,0),totalRevenue=campArr.reduce((s,c)=>s+c.주문금액,0);
    if(metric==='유입比 주문전환율')return totalSess>0?totalOrders/totalSess:0;
    if(metric==='상세比 주문전환율')return totalPdp>0?totalOrders/totalPdp:0;
    if(metric==='상품상세전환율')return totalSess>0?totalPdp/totalSess:0;
    if(metric==='평균주문금액')return totalOrders>0?totalRevenue/totalOrders:0;
  }
  return campArr.reduce((s,c)=>s+(c[metric]||0),0);
}

function fmt(metric,val){
  if(val===undefined||val===null||isNaN(val))return '-';
  if(metric.includes('전환율'))return(val*100).toFixed(1)+'%';
  if(metric==='평균주문금액'||metric==='주문금액'){
    if(val>=1e8)return(val/1e8).toFixed(1)+'억';
    if(val>=1e4)return(val/1e4).toFixed(0)+'만';
    return val.toFixed(0);
  }
  return Math.round(val).toLocaleString();
}

function fmtDelta(curr,prev,metric){
  if(!prev||prev===0)return{text:'-',cls:'delta-flat'};
  const pct=((curr-prev)/prev*100),sign=pct>=0?'+':'';
  const up=pct>0,cls=Math.abs(pct)<0.5?'delta-flat':(up?'delta-up':'delta-down');
  return{text:`${sign}${pct.toFixed(1)}%`,cls};
}

function initDates(){
  const allDates=RAW_DATA.map(r=>r[COL.date]).filter(Boolean);
  if(!allDates.length)return;
  const maxDate=allDates.reduce((a,b)=>a>b?a:b,'');
  const today=new Date(maxDate+'T00:00:00');
  const yesterday=addDays(today,-1);
  const monthStart=new Date(today.getFullYear(),today.getMonth(),1);
  currentDateFrom=toDateStr(monthStart);
  currentDateTo=toDateStr(yesterday);
  document.getElementById('dateFrom').value=currentDateFrom;
  document.getElementById('dateTo').value=currentDateTo;
  document.getElementById('preset-mtd').classList.add('active');
  updateHeader();
}

function updateHeader(){
  document.getElementById('headerSub').textContent=`${currentDateFrom} ~ ${currentDateTo} | CRM 성과 대시보드`;
}

function setPreset(type){
  document.querySelectorAll('.preset-btn[id^=&quot;preset-&quot;]').forEach(b=>b.classList.remove('active'));
  document.getElementById(`preset-${type}`)?.classList.add('active');
  const allDates=RAW_DATA.map(r=>r[COL.date]).filter(Boolean);
  if(!allDates.length)return;
  const maxDate=allDates.reduce((a,b)=>a>b?a:b,'');
  const today=new Date(maxDate+'T00:00:00');
  const yesterday=addDays(today,-1);
  if(type==='mtd'){currentDateFrom=toDateStr(new Date(today.getFullYear(),today.getMonth(),1));currentDateTo=toDateStr(yesterday);}
  else if(type==='last7'){currentDateFrom=toDateStr(addDays(yesterday,-6));currentDateTo=toDateStr(yesterday);}
  else if(type==='last30'){currentDateFrom=toDateStr(addDays(yesterday,-29));currentDateTo=toDateStr(yesterday);}
  else if(type==='prevMonth'){const pm=new Date(today.getFullYear(),today.getMonth()-1,1),pmEnd=new Date(today.getFullYear(),today.getMonth(),0);currentDateFrom=toDateStr(pm);currentDateTo=toDateStr(pmEnd);}
  else if(type==='all'){currentDateFrom=allDates.reduce((a,b)=>a<b?a:b,'');currentDateTo=maxDate;}
  document.getElementById('dateFrom').value=currentDateFrom;
  document.getElementById('dateTo').value=currentDateTo;
  applyDateFilter();
}

function applyDateFilter(){
  currentDateFrom=document.getElementById('dateFrom').value;
  currentDateTo=document.getElementById('dateTo').value;
  document.querySelectorAll('.preset-btn[id^=&quot;preset-&quot;]').forEach(b=>b.classList.remove('active'));
  updateHeader();refreshAll();
}

function setCompareMode(mode){
  compareMode=mode;

  document.getElementById(`cmp-${mode}`)?.classList.add('active');

function refreshAll(){

function updateCompBanner(){
  const banner=document.getElementById('compBanner');
  if(compareMode==='none'){banner.style.display='none';return;}
  const cp=getCompPeriod(currentDateFrom,currentDateTo);
  if(!cp){banner.style.display='none';return;}
  const curr=getAggData(),prev=getCompAggData();
  const modeLabel=compareMode==='mom'?'전월 동기간':'전주 동기간';
  const kpis=['주문금액','주문수','세션수','유입比 주문전환율'];
  banner.style.display='grid';
  banner.innerHTML=kpis.map(m=>{
    const cv=sumMetric(curr,m),pv=prev?sumMetric(prev,m):null;
    const delta=pv!==null?fmtDelta(cv,pv,m):{text:'-',cls:'delta-flat'};
    return `<div class=&quot;comp-card&quot;><div class=&quot;comp-card-title&quot;>${m}</div>
      <div class=&quot;comp-row&quot;><span class=&quot;comp-period-label&quot;>선택기간</span><span class=&quot;comp-value&quot;>${fmt(m,cv)}</span></div>
      ${pv!==null?`<div class=&quot;comp-row&quot;><span class=&quot;comp-period-label&quot;>${modeLabel}</span><span class=&quot;comp-value&quot; style=&quot;color:var(--text-muted)&quot;>${fmt(m,pv)}</span></div>`:''}
      <div style=&quot;margin-top:6px;&quot;><span class=&quot;comp-delta ${delta.cls}&quot;>${delta.text}</span><span style=&quot;font-size:10px;color:var(--text-muted);margin-left:6px;&quot;>vs ${modeLabel}</span></div>
    </div>`;
  }).join('');
}

function buildMetricBar(){

function setMetric(m){currentMetric=m;buildMetricBar();buildStatCards();updateMainBar();updateTopCampaign();updateFullTable();}

function buildStatCards(){
  const data=getAggData();
  const total=sumMetric(data,currentMetric);
  const vals=data.map(r=>r[currentMetric]).filter(v=>v>0);
  const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  const sorted=[...vals].sort((a,b)=>a-b);
  const med=sorted.length?(sorted.length%2?sorted[Math.floor(sorted.length/2)]:(sorted[sorted.length/2-1]+sorted[sorted.length/2])/2):0;
  const max=vals.length?Math.max(...vals):0;
  const maxCamp=data.find(r=>r[currentMetric]===max);
  const compData=getCompAggData();
  const compTotal=compData?sumMetric(compData,currentMetric):null;
  const delta=compTotal!==null?fmtDelta(total,compTotal,currentMetric):null;
  const cards=[
    {label:'전체 합계',value:fmt(currentMetric,total),sub:delta?`<span class=&quot;comp-delta ${delta.cls}&quot;>${delta.text} vs ${compareMode==='mom'?'전월':'전주'}</span>`:`${vals.length}개 캠페인`,accent:'#4f8ef7'},
    {label:'평균값',value:fmt(currentMetric,avg),sub:`중간값 ${fmt(currentMetric,med)}`,accent:'#4fcea4'},
    {label:'최고값',value:fmt(currentMetric,max),sub:(maxCamp?.campaign||'-').substring(0,22),accent:'#f7c74f'},
    {label:'캠페인 수',value:data.length.toString(),sub:`${Object.keys(data.reduce((o,r)=>{o[r.path2]=1;return o},{})).length}개 채널`,accent:'#f76f4f'},
  ];
  document.getElementById('statGrid').innerHTML=cards.map(c=>`
    <div class=&quot;stat-card&quot; style=&quot;--card-accent:${c.accent}&quot;>
      <div class=&quot;stat-label&quot;>${c.label}</div>
      <div class=&quot;stat-value&quot;>${c.value}</div>
      <div class=&quot;stat-sub&quot;>${c.sub}</div>
    </div>`).join('');
}

function aggByChannel(campArr,metric){
  const ch={};
  for(const r of campArr){if(!ch[r.path2])ch[r.path2]=[];ch[r.path2].push(r);}
  const result={};
  for(const[k,v]of Object.entries(ch))result[k]=sumMetric(v,metric);
  return result;
}

function getChannelColor(ch){
  if(CHANNEL_COLORS[ch])return CHANNEL_COLORS[ch];
  const palette=['#4f8ef7','#4fcea4','#f7c74f','#f76f4f','#a78bfa','#38bdf8','#fb7185'];
  const keys=Object.keys(CHANNEL_COLORS);
  return palette[keys.length%palette.length];
}

function updateMainBar(){
  const data=getAggData();

function buildScatter(){
  const data=getAggData();

  }
  const datasets=Object.entries(byChannel).map(([ch,pts])=>({label:ch,data:pts,backgroundColor:(getChannelColor(ch))+'99',borderColor:getChannelColor(ch),pointRadius:5,pointHoverRadius:8,borderWidth:1}));

    type:'scatter',data:{datasets},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#9ca3af',font:{family:'Noto Sans KR',size:10},boxWidth:10}},tooltip:{callbacks:{label:ctx=>`${ctx.raw.label}: (${ctx.raw.x.toFixed(1)}%, ${ctx.raw.y.toFixed(1)}%)`}}},scales:{x:{title:{display:true,text:'유입比 전환율 (%)',color:'#6b7280',font:{size:10}},grid:{color:'#252a38'},ticks:{color:'#9ca3af',font:{size:9}}},y:{title:{display:true,text:'상세比 전환율 (%)',color:'#6b7280',font:{size:10}},grid:{color:'#252a38'},ticks:{color:'#9ca3af',font:{size:9}}}}}

}

function buildFunnel(){

  }).join('')}</tbody></table>`;
}

// ===== CAMPAIGN COMPARE =====
const COMPARE_COLORS=['#4f8ef7','#4fcea4','#f7c74f','#f76f4f','#a78bfa','#38bdf8','#fb7185','#34d399','#fbbf24','#818cf8'];
function initCampaignCompare(){
  const sel=document.getElementById('channelFilter');
  sel.innerHTML='<option value=&quot;&quot;>전체 채널</option>';
  const channels=[...new Set(RAW_DATA.map(r=>r[COL.path2]))].sort();
  channels.forEach(ch=>{const o=document.createElement('option');o.value=ch;o.textContent=ch;sel.appendChild(o);});
  sel.onchange=()=>{selectedCampaigns.clear();renderSelectedTags();filterCampaignList();showDropdown();};
  document.addEventListener('click',e=>{if(!document.getElementById('campaignCompareSection').contains(e.target)){document.getElementById('campaignDropdown').style.display='none';}});
  filterCampaignList();
}
function getFilteredCampaigns(){
  const ch=document.getElementById('channelFilter').value,q=document.getElementById('campaignSearch').value.toLowerCase();
  const data=getAggData();
  return data.filter(r=>(!ch||r.path2===ch)&&(!q||r.campaign.toLowerCase().includes(q))).map(r=>({campaign:r.campaign,path2:r.path2})).filter((v,i,arr)=>arr.findIndex(x=>x.campaign===v.campaign)===i).sort((a,b)=>a.campaign.localeCompare(b.campaign));
}
function filterCampaignList(){
  const items=getFilteredCampaigns(),dd=document.getElementById('campaignDropdown');
  dd.innerHTML='';
  if(!items.length){dd.innerHTML='<div style=&quot;padding:12px;color:var(--text-muted);font-size:12px;&quot;>검색 결과 없음</div>';dd.style.display='block';return;}
  items.forEach(item=>{
    const isSel=selectedCampaigns.has(item.campaign),pillCls=CHANNEL_PILL[item.path2]||'';
    const div=document.createElement('div');
    div.style.cssText=`padding:9px 14px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:background .15s;border-bottom:1px solid rgba(37,42,56,.4);${isSel?'background:rgba(79,142,247,0.1);':''}`;
    div.innerHTML=`<div style=&quot;width:16px;height:16px;border-radius:4px;border:2px solid ${isSel?'var(--accent)':'var(--border)'};background:${isSel?'var(--accent)':'transparent'};display:flex;align-items:center;justify-content:center;flex-shrink:0;&quot;>${isSel?'<svg width=&quot;10&quot; height=&quot;8&quot; viewBox=&quot;0 0 10 8&quot;><path d=&quot;M1 4l3 3 5-6&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.5&quot; fill=&quot;none&quot; stroke-linecap=&quot;round&quot;/></svg>':''}</div><span style=&quot;font-size:12px;color:var(--text-dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;&quot;>${item.campaign}</span><span class=&quot;pill ${pillCls}&quot; style=&quot;font-size:9px;&quot;>${item.path2}</span>`;
    div.onclick=e=>{e.stopPropagation();toggleCampaign(item.campaign);};
    dd.appendChild(div);
  });
  dd.style.display='block';
}
function showDropdown(){filterCampaignList();document.getElementById('campaignDropdown').style.display='block';}
function toggleCampaign(c){selectedCampaigns.has(c)?selectedCampaigns.delete(c):selectedCampaigns.add(c);renderSelectedTags();filterCampaignList();}
function renderSelectedTags(){
  document.getElementById('selectedCount').textContent=`${selectedCampaigns.size}개 선택`;
  const container=document.getElementById('selectedTags');
  if(!selectedCampaigns.size){container.innerHTML='<span style=&quot;color:var(--text-muted);font-size:11px;align-self:center;&quot;>캠페인을 선택하세요</span>';return;}
  container.innerHTML=[...selectedCampaigns].map(c=>`<span style=&quot;display:inline-flex;align-items:center;gap:5px;background:rgba(79,142,247,.15);border:1px solid rgba(79,142,247,.3);border-radius:14px;padding:3px 10px;font-size:11px;color:var(--accent);&quot;>${c.length>20?c.substring(0,20)+'…':c}<span onclick=&quot;toggleCampaign('${c.replace(/'/g,&quot;&#x27;&quot;)}');event.stopPropagation();&quot; style=&quot;cursor:pointer;color:var(--text-muted);&quot;>×</span></span>`).join('');
}
function selectAllCampaigns(){getFilteredCampaigns().forEach(item=>selectedCampaigns.add(item.campaign));renderSelectedTags();filterCampaignList();}
function clearCampaigns(){selectedCampaigns.clear();renderSelectedTags();filterCampaignList();}
function runComparison(){
  if(!selectedCampaigns.size){alert('캠페인을 1개 이상 선택해주세요.');return;}
  document.getElementById('campaignDropdown').style.display='none';
  document.getElementById('compareEmpty').style.display='none';
  document.getElementById('compareResult').style.display='block';
  const campaigns=[...selectedCampaigns];
  const allCampData=getAggData();

// ===== FUNNEL ANALYSIS =====
const FUNNEL_STEPS=['세션수','상품상세세션수','장바구니세션수','체크아웃세션수','주문수'];
const FUNNEL_LABELS=['유입 세션','상품 상세','장바구니','체크아웃','주문 완료'];
const FUNNEL_ICONS=['👥','📄','🛒','💳','✅'];
const FUNNEL_COLORS=['#4fcea4','#4f8ef7','#f7c74f','#f76f4f','#a78bfa','#38bdf8','#fb7185','#fbbf24'];
function initFunnelSection(){

function getFunnelFilteredCampaigns(){

  return getAggData().filter(r=>(!ch||r.path2===ch)&&(!q||r.campaign.toLowerCase().includes(q))&&r.세션수>0).map(r=>({campaign:r.campaign,path2:r.path2})).filter((v,i,arr)=>arr.findIndex(x=>x.campaign===v.campaign)===i).sort((a,b)=>a.campaign.localeCompare(b.campaign));
}
function filterFunnelList(){
  const items=getFunnelFilteredCampaigns(),dd=document.getElementById('funnelDropdown');
  dd.innerHTML='';

function runFunnelAnalysis(){
  if(!funnelSelectedCampaigns.size){alert('캠페인을 1개 이상 선택해주세요.');return;}

  const funnelCtx=document.getElementById('funnelCampChart').getContext('2d');
  if(funnelCharts.main)funnelCharts.main.destroy();
  funnelCharts.main=new Chart(funnelCtx,{type:'bar',data:{labels:FUNNEL_LABELS,datasets:campaigns.map((c,i)=>({label:c.length>16?c.substring(0,16)+'…':c,data:FUNNEL_STEPS.map(s=>mode==='absolute'?(campData[i][s]||0):campData[i].세션수>0?+((campData[i][s]||0)/campData[i].세션수*100).toFixed(1):0),backgroundColor:FUNNEL_COLORS[i%FUNNEL_COLORS.length]+'88',borderColor:FUNNEL_COLORS[i%FUNNEL_COLORS.length],borderWidth:2,borderRadius:4}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#9ca3af',font:{family:'Noto Sans KR',size:10},boxWidth:10,padding:12}}},scales:{x:{grid:{color:'#252a38'},ticks:{color:'#e8eaf2',font:{family:'Noto Sans KR',size:11}}},y:{grid:{color:'#252a38'},ticks:{color:'#9ca3af',font:{family:'Space Mono',size:9},callback:v=>mode==='rate'?v+'%':v>=1000?(v/1000).toFixed(1)+'k':v}}}}});
  const dropLabels=['세션→상세','상세→장바구니','장바구니→체크아웃','체크아웃→주문'];
  const dropCtx=document.getElementById('funnelDropoffChart').getContext('2d');
  if(funnelCharts.dropoff)funnelCharts.dropoff.destroy();
  funnelCharts.dropoff=new Chart(dropCtx,{type:'line',data:{labels:dropLabels,datasets:campaigns.map((c,i)=>{const r=campData[i],steps=FUNNEL_STEPS.map(s=>r[s]||0),drops=[0,1,2,3].map(j=>steps[j]>0?+((1-steps[j+1]/steps[j])*100).toFixed(1):0);return{label:c.length>16?c.substring(0,16)+'…':c,data:drops,borderColor:FUNNEL_COLORS[i%FUNNEL_COLORS.length],backgroundColor:FUNNEL_COLORS[i%FUNNEL_COLORS.length]+'44',pointBackgroundColor:FUNNEL_COLORS[i%FUNNEL_COLORS.length],pointRadius:5,borderWidth:2.5,tension:.3,fill:false};})},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#9ca3af',font:{family:'Noto Sans KR',size:10},boxWidth:10,padding:12}}},scales:{x:{grid:{color:'#252a38'},ticks:{color:'#e8eaf2',font:{family:'Noto Sans KR',size:10}}},y:{grid:{color:'#252a38'},ticks:{color:'#9ca3af',font:{family:'Space Mono',size:9},callback:v=>v+'%'},min:0,max:100}}}});
  const convCalc=campData.map(r=>{const steps=FUNNEL_STEPS.map(s=>r[s]||0);return[0,1,2,3].map(j=>steps[j]>0?+(steps[j+1]/steps[j]*100).toFixed(1):0);});

  document.getElementById('funnelResult').scrollIntoView({behavior:'smooth',block:'start'});

// ===== INIT =====
function showMainContent(){
  document.getElementById('emptyState').style.display='none';
  document.getElementById('mainContent').style.display='block';
}

function init(){
  const sel=document.getElementById('sortMetricSel');
  sel.innerHTML='';
  DISPLAY_METRICS.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;if(m===currentMetric)o.selected=true;sel.appendChild(o);});
  sel.onchange=updateFullTable;
  document.getElementById('sortOrderSel').onchange=updateFullTable;
  if(RAW_DATA.length){
    showMainContent();
    initDates();
    buildMetricBar();
    refreshAll();
    initCampaignCompare();
    initFunnelSection();
  }
}

// ===== postMessage HANDLER (receives CSV data from parent) =====
window.addEventListener('message', function(e) {
  if (!e.data || e.data.type !== 'CRM_DATA') return;
  
  // Replace RAW_DATA
  RAW_DATA.length = 0;
  Array.prototype.push.apply(RAW_DATA, e.data.payload);
  
  // Reset state
  currentMetric = '주문금액';
  currentDateFrom = '';
  currentDateTo = '';
  compareMode = 'none';
  drillChannel = null;
  selectedCampaigns = new Set();
  funnelSelectedCampaigns = new Set();
  
  // Reset compare mode buttons
  document.querySelectorAll('[id^=&quot;cmp-&quot;]').forEach(b => b.classList.remove('active'));
  document.getElementById('cmp-none')?.classList.add('active');
  
  // Destroy all charts
  Object.values(chartInstances).forEach(c => { try { c.destroy(); } catch(e){} });
  chartInstances = {};
  Object.values(compareCharts).forEach(c => { try { c.destroy(); } catch(e){} });
  compareCharts = {};
  Object.values(funnelCharts).forEach(c => { try { c.destroy(); } catch(e){} });
  funnelCharts = {};
  
  // Reset compare/funnel UI
  document.getElementById('drillPanel').classList.remove('visible');
  document.getElementById('compareResult').style.display = 'none';
  document.getElementById('compareEmpty').style.display = 'block';
  document.getElementById('funnelResult').style.display = 'none';
  document.getElementById('funnelEmpty').style.display = 'block';
  
  // Re-initialize
  showMainContent();
  initDates();
  buildMetricBar();
  
  const sortSel = document.getElementById('sortMetricSel');
  sortSel.innerHTML = '';
  DISPLAY_METRICS.forEach(m => {
    const o = document.createElement('option');
    o.value = m; o.textContent = m;
    if (m === currentMetric) o.selected = true;
    sortSel.appendChild(o);
  });
  
  refreshAll();
  initCampaignCompare();
  initFunnelSection();
});

init();

  .sidebar { width: 280px; min-width: 240px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px 16px; overflow-y: auto; flex-shrink: 0; }
  .main { flex: 1; padding: 24px 28px; overflow-y: auto; min-width: 0; }
  .sb-section { margin-bottom: 24px; }
  .sb-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; padding-left: 4px; }
  .mode-toggle { display: flex; background: var(--surface2); border-radius: 8px; padding: 3px; gap: 3px; }
  .mode-btn { flex: 1; padding: 7px 0; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; background: transparent; color: var(--text-muted); transition: all 0.2s; font-family: inherit; }
  .mode-btn.active { background: var(--accent); color: #fff; }
  .channel-list { display: flex; flex-direction: column; gap: 6px; }
  .channel-pill { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px; cursor: pointer; transition: background 0.15s; border: 1px solid transparent; }
  .channel-pill:hover { background: var(--surface2); }
  .channel-pill.selected { background: var(--surface2); border-color: var(--border); }
  .ch-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .ch-name { font-size: 13px; font-weight: 500; }
  .ch-check { margin-left: auto; width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; transition: all 0.15s; font-size: 11px; }
  .channel-pill.selected .ch-check { background: var(--accent); border-color: var(--accent); color: #fff; }
  .campaign-toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 8px; background: var(--surface2); cursor: pointer; border: 1px solid var(--border); margin-bottom: 8px; }
  .campaign-toggle-row .toggle-label { font-size: 13px; font-weight: 600; }
  .toggle-switch { width: 36px; height: 20px; background: var(--border); border-radius: 10px; position: relative; transition: background 0.2s; flex-shrink: 0; }
  .toggle-switch.on { background: var(--accent); }
  .toggle-thumb { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left 0.2s; }
  .toggle-switch.on .toggle-thumb { left: 18px; }
  #campaign-panel { display: none; }
  #campaign-panel.visible { display: block; }
  .campaign-search { width: 100%; padding: 8px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 12px; font-family: inherit; margin-bottom: 8px; outline: none; }
  .campaign-search:focus { border-color: var(--accent); }
  .campaign-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
  .campaign-list::-webkit-scrollbar { width: 4px; }
  .campaign-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .campaign-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; color: var(--text-dim); transition: background 0.1s; }
  .campaign-item:hover { background: var(--surface2); color: var(--text); }
  .campaign-item.selected { color: var(--text); background: rgba(99,102,241,0.1); }
  .c-check { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 10px; transition: all 0.1s; }
  .campaign-item.selected .c-check { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sel-bar { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 11px; color: var(--text-muted); }
  .sel-bar span { cursor: pointer; color: var(--accent); }
  .sel-bar span:hover { text-decoration: underline; }
  .metric-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .metric-btn { padding: 6px 4px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text-dim); font-size: 11px; font-weight: 500; cursor: pointer; text-align: center; transition: all 0.15s; font-family: inherit; line-height: 1.3; }
  .metric-btn:hover { border-color: var(--accent); color: var(--text); }
  .metric-btn.active { background: rgba(99,102,241,0.15); border-color: var(--accent); color: var(--accent); }
  .section-title { font-size: 15px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ''; width: 3px; height: 18px; background: linear-gradient(to bottom, var(--accent), var(--accent2)); border-radius: 3px; }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .kpi-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; transition: border-color 0.2s; }
  .kpi-card:hover { border-color: var(--accent); }
  .kpi-name { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
  .kpi-val { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  .kpi-change { margin-top: 6px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 3px; }
  .kpi-change.up { color: var(--green); }
  .kpi-change.down { color: var(--red); }
  .kpi-change.flat { color: var(--text-muted); }
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  @media (max-width: 900px) { .chart-grid { grid-template-columns: 1fr; } }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
  .chart-card.full { grid-column: 1 / -1; }
  .chart-title { font-size: 13px; font-weight: 600; margin-bottom: 14px; color: var(--text-dim); display: flex; align-items: center; justify-content: space-between; }
  .chart-wrap { position: relative; height: 220px; }
  .chart-wrap-lg { position: relative; height: 280px; }
  .change-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
  .change-table th { text-align: left; padding: 7px 10px; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .change-table td { padding: 7px 10px; border-bottom: 1px solid rgba(37,42,56,0.5); white-space: nowrap; }
  .change-table tr:last-child td { border-bottom: none; }
  .change-table tr:hover td { background: rgba(99,102,241,0.04); }
  .badge { display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge.up { background: rgba(34,211,238,0.12); color: var(--green); }
  .badge.down { background: rgba(244,63,94,0.12); color: var(--red); }
  .badge.flat { background: rgba(100,116,139,0.1); color: var(--text-muted); }
  .no-data { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--text-muted); font-size: 13px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; background: rgba(99,102,241,0.15); color: var(--accent); margin-left: 8px; }
  .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 16px; color: var(--text-muted); }
  .empty-state .icon { font-size: 52px; }
  .empty-state .msg { font-size: 15px; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  @media (max-width: 720px) { .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); } .layout { flex-direction: column; } .main { padding: 16px; } .kpi-row { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<div class=&quot;header&quot;>
  <div class=&quot;header-icon&quot;>📊</div>
  <div>
    <div class=&quot;header-title&quot;>유입 상세 지표 대시보드</div>
    <div class=&quot;header-sub&quot;>채널 · 캠페인 월별 추세 &amp; 변화율 분석</div>
  </div>
</div>

<div class=&quot;layout&quot;>
  <aside class=&quot;sidebar&quot;>
    <div class=&quot;sb-section&quot;>
      <div class=&quot;sb-label&quot;>분석 단위</div>
      <div class=&quot;mode-toggle&quot;>
        <button class=&quot;mode-btn active&quot; id=&quot;btn-channel&quot; onclick=&quot;setMode('channel')&quot;>채널별</button>
        <button class=&quot;mode-btn&quot; id=&quot;btn-campaign&quot; onclick=&quot;setMode('campaign')&quot;>캠페인별</button>
      </div>
    </div>
    <div class=&quot;sb-section&quot; id=&quot;channel-section&quot;>
      <div class=&quot;sb-label&quot;>채널 선택</div>
      <div class=&quot;channel-list&quot; id=&quot;channel-list&quot;></div>
    </div>
    <div class=&quot;sb-section&quot; id=&quot;campaign-section&quot; style=&quot;display:none&quot;>
      <div class=&quot;campaign-toggle-row&quot; onclick=&quot;toggleCampaignPanel()&quot;>
        <span class=&quot;toggle-label&quot;>캠페인 드릴다운</span>
        <div class=&quot;toggle-switch&quot; id=&quot;camp-switch&quot;><div class=&quot;toggle-thumb&quot;></div></div>
      </div>
      <div id=&quot;campaign-panel&quot;>
        <input class=&quot;campaign-search&quot; type=&quot;text&quot; placeholder=&quot;캠페인 검색…&quot; oninput=&quot;filterCampaigns(this.value)&quot;>
        <div class=&quot;sel-bar&quot;>
          <span onclick=&quot;selectAllCampaigns()&quot;>전체 선택</span>
          <span onclick=&quot;clearCampaigns()&quot;>전체 해제</span>
        </div>
        <div class=&quot;campaign-list&quot; id=&quot;campaign-list&quot;></div>
      </div>
    </div>
    <div class=&quot;sb-section&quot;>
      <div class=&quot;sb-label&quot;>지표 선택</div>
      <div class=&quot;metric-grid&quot; id=&quot;metric-grid&quot;></div>
    </div>
  </aside>

  <main class=&quot;main&quot;>
    <div id=&quot;emptyState&quot; class=&quot;empty-state&quot;>
      <div class=&quot;icon&quot;>📂</div>
      <div class=&quot;msg&quot;>상단의 <strong>CSV 업로드</strong> 버튼으로 데이터를 불러오세요</div>
    </div>
    <div id=&quot;mainContent&quot; style=&quot;display:none&quot;>
      <div class=&quot;section-title&quot; id=&quot;main-title&quot;>채널별 월간 추세</div>
      <div class=&quot;kpi-row&quot; id=&quot;kpi-row&quot;></div>
      <div class=&quot;chart-grid&quot; id=&quot;chart-grid&quot;></div>
      <div class=&quot;chart-card&quot; style=&quot;margin-bottom:16px&quot;>
        <div class=&quot;chart-title&quot;>월별 변화율 <span class=&quot;tag&quot;>MoM %</span></div>
        <div id=&quot;change-table-wrap&quot; style=&quot;overflow-x:auto&quot;></div>
      </div>
    </div>
  </main>
</div>

<script>
// ─── DATA (populated via postMessage) ───
let MONTHS = [];
let CHANNELS = [];
let CAMPAIGNS = [];
let METRICS = ['세션수','상품상세세션수','장바구니세션수','체크아웃세션수','주문수','주문금액','평균주문금액','유입比 주문전환율','상세比 주문전환율','상품상세전환율'];
let RATE_METRICS = ['평균주문금액','유입比 주문전환율','상세比 주문전환율','상품상세전환율'];
let CHANNEL_DATA = {};
let CAMPAIGN_DATA = {};

const CH_COLORS = ['#6366f1','#22d3ee','#f59e0b','#ec4899','#a78bfa','#34d399','#fb923c','#f472b6'];
const CH_BG = ['rgba(99,102,241,0.12)','rgba(34,211,238,0.12)','rgba(245,158,11,0.12)','rgba(236,72,153,0.12)','rgba(167,139,250,0.12)','rgba(52,211,153,0.12)','rgba(251,146,60,0.12)','rgba(244,114,182,0.12)'];

// ─── STATE ───
let mode = 'channel';
let selectedChannels = new Set();
let selectedCampaigns = new Set();
let selectedMetric = '세션수';
let campaignPanelOpen = false;
let campaignFilterText = '';
let chartInstances = {};

function getChColor(i){ return CH_COLORS[i % CH_COLORS.length]; }
function getChBg(i){ return CH_BG[i % CH_BG.length]; }

// ─── BUILD UI ───
function buildChannelList(){
  const el=document.getElementById('channel-list');
  el.innerHTML=CHANNELS.map((ch,i)=>`
    <div class=&quot;channel-pill selected&quot; id=&quot;chpill-${i}&quot; onclick=&quot;toggleChannel(${i})&quot;>
      <div class=&quot;ch-dot&quot; style=&quot;background:${getChColor(i)}&quot;></div>
      <span class=&quot;ch-name&quot;>${ch}</span>
      <div class=&quot;ch-check&quot;>✓</div>
    </div>`).join('');
  selectedChannels = new Set(CHANNELS);
}

function buildCampaignList(){ renderCampaignItems(CAMPAIGNS); }

function renderCampaignItems(list){
  const el=document.getElementById('campaign-list');
  el.innerHTML=list.map(c=>{
    const sel=selectedCampaigns.has(c);
    return `<div class=&quot;campaign-item ${sel?'selected':''}&quot; onclick=&quot;toggleCampaign('${c.replace(/'/g,&quot;&#x27;&quot;)}')&quot;>
      <div class=&quot;c-check&quot;>${sel?'✓':''}</div>
      <span>${c}</span>
    </div>`;
  }).join('');
}

function buildMetricGrid(){
  const el=document.getElementById('metric-grid');
  el.innerHTML=METRICS.map(m=>`<button class=&quot;metric-btn ${m===selectedMetric?'active':''}&quot; onclick=&quot;selectMetric('${m}')&quot;>${m}</button>`).join('');
}

// ─── CONTROLS ───
function setMode(m){
  mode=m;
  document.getElementById('btn-channel').classList.toggle('active',m==='channel');
  document.getElementById('btn-campaign').classList.toggle('active',m==='campaign');
  document.getElementById('channel-section').style.display=m==='channel'?'':'none';
  document.getElementById('campaign-section').style.display=m==='campaign'?'':'none';
  document.getElementById('main-title').textContent=m==='channel'?'채널별 월간 추세':'캠페인별 월간 추세';
  render();
}

function toggleChannel(i){
  const ch=CHANNELS[i],el=document.getElementById(`chpill-${i}`);
  if(selectedChannels.has(ch)){if(selectedChannels.size===1)return;selectedChannels.delete(ch);el.classList.remove('selected');}
  else{selectedChannels.add(ch);el.classList.add('selected');}
  render();
}

function toggleCampaignPanel(){
  campaignPanelOpen=!campaignPanelOpen;
  document.getElementById('camp-switch').classList.toggle('on',campaignPanelOpen);
  document.getElementById('campaign-panel').classList.toggle('visible',campaignPanelOpen);
  render();
}

function toggleCampaign(c){
  if(selectedCampaigns.has(c))selectedCampaigns.delete(c);else selectedCampaigns.add(c);
  filterCampaigns(campaignFilterText);render();
}

function filterCampaigns(val){
  campaignFilterText=val;
  renderCampaignItems(CAMPAIGNS.filter(c=>c.toLowerCase().includes(val.toLowerCase())));
}

function selectAllCampaigns(){CAMPAIGNS.forEach(c=>selectedCampaigns.add(c));filterCampaigns(campaignFilterText);render();}
function clearCampaigns(){selectedCampaigns.clear();filterCampaigns(campaignFilterText);render();}
function selectMetric(m){selectedMetric=m;buildMetricGrid();render();}

// ─── DATA HELPERS ───
function getActiveItems(){
  if(mode==='channel'){
    return Array.from(selectedChannels).map(ch=>({
      label:ch, color:getChColor(CHANNELS.indexOf(ch)), bg:getChBg(CHANNELS.indexOf(ch)),
      data:(CHANNEL_DATA[ch]&&CHANNEL_DATA[ch][selectedMetric])||new Array(MONTHS.length).fill(0)
    }));
  } else {
    if(!campaignPanelOpen||selectedCampaigns.size===0){
      return CHANNELS.map((ch,i)=>({
        label:ch,color:getChColor(i),bg:getChBg(i),
        data:(CHANNEL_DATA[ch]&&CHANNEL_DATA[ch][selectedMetric])||new Array(MONTHS.length).fill(0)
      }));
    }
    const palette=['#6366f1','#22d3ee','#f59e0b','#ec4899','#a78bfa','#34d399','#fb923c','#f472b6','#818cf8','#2dd4bf'];
    return Array.from(selectedCampaigns).slice(0,10).map((c,i)=>({
      label:c,color:palette[i%palette.length],bg:`rgba(${hexToRgb(palette[i%palette.length])},0.1)`,
      data:(CAMPAIGN_DATA[c]&&CAMPAIGN_DATA[c][selectedMetric])||new Array(MONTHS.length).fill(0)
    }));
  }
}

function hexToRgb(hex){const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return `${r},${g},${b}`;}

function fmtVal(v,metric){
  if(v===null||v===undefined||isNaN(v))return '-';
  if(RATE_METRICS.includes(metric)&&metric!=='평균주문금액')return (v*100).toFixed(2)+'%';
  if(metric==='평균주문금액'||metric==='주문금액')return '₩'+Math.round(v).toLocaleString();
  return Math.round(v).toLocaleString();
}

function calcChange(prev,curr){if(!prev||prev===0)return null;return((curr-prev)/prev)*100;}

// ─── RENDER ───
function render(){
  if(!MONTHS.length)return;
  const items=getActiveItems();
  renderKPI(items);renderCharts(items);renderChangeTable(items);
}

function renderKPI(items){
  const lastIdx=MONTHS.length-1,prevIdx=lastIdx-1;
  const el=document.getElementById('kpi-row');
  el.innerHTML=items.map(item=>{
    const curr=item.data[lastIdx]||0,prev=item.data[prevIdx]||0;
    const chg=calcChange(prev,curr);
    let chgHtml='';
    if(chg!==null){
      const cls=chg>0?'up':chg<0?'down':'flat',arrow=chg>0?'▲':chg<0?'▼':'—';
      chgHtml=`<div class=&quot;kpi-change ${cls}&quot;>${arrow} ${Math.abs(chg).toFixed(1)}% MoM</div>`;
    }
    return `<div class=&quot;kpi-card&quot;>
      <div class=&quot;kpi-name&quot;>${item.label}</div>
      <div class=&quot;kpi-val&quot; style=&quot;color:${item.color}&quot;>${fmtVal(curr,selectedMetric)}</div>
      <div style=&quot;font-size:10px;color:var(--text-muted);margin-top:3px&quot;>${MONTHS[lastIdx]}</div>
      ${chgHtml}
    </div>`;
  }).join('');
}

function renderCharts(items){
  const el=document.getElementById('chart-grid');
  Object.values(chartInstances).forEach(c=>c.destroy());
  chartInstances={};
  const mainId='chart-trend',barId='chart-bar',changeId='chart-change';
  el.innerHTML=`
    <div class=&quot;chart-card full&quot;>
      <div class=&quot;chart-title&quot;>📈 ${selectedMetric} — 월별 추세</div>
      <div class=&quot;chart-wrap-lg&quot;><canvas id=&quot;${mainId}&quot;></canvas></div>
    </div>
    <div class=&quot;chart-card&quot;>
      <div class=&quot;chart-title&quot;>📊 월별 합계 / 평균</div>
      <div class=&quot;chart-wrap&quot;><canvas id=&quot;${barId}&quot;></canvas></div>
    </div>
    <div class=&quot;chart-card&quot;>
      <div class=&quot;chart-title&quot;>📉 전월 대비 변화율 (%)</div>
      <div class=&quot;chart-wrap&quot;><canvas id=&quot;${changeId}&quot;></canvas></div>
    </div>`;
  const baseOpts={responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'top',labels:{color:'#94a3b8',font:{family:'Pretendard',size:11},boxWidth:10,padding:16}},tooltip:{backgroundColor:'#1a1e2b',borderColor:'#252a38',borderWidth:1,titleColor:'#e2e8f0',bodyColor:'#94a3b8',padding:10,callbacks:{label:ctx=>` ${ctx.dataset.label}: ${fmtVal(ctx.parsed.y,selectedMetric)}`}}},scales:{x:{ticks:{color:'#64748b',font:{family:'Pretendard',size:11}},grid:{color:'rgba(37,42,56,0.6)'}},y:{ticks:{color:'#64748b',font:{family:'Pretendard',size:11},callback:v=>fmtVal(v,selectedMetric)},grid:{color:'rgba(37,42,56,0.6)'}}}};
  const lineCtx=document.getElementById(mainId).getContext('2d');
  chartInstances[mainId]=new Chart(lineCtx,{type:'line',data:{labels:MONTHS.map(m=>m.replace('20','').replace('-','/')),datasets:items.map(item=>({label:item.label,data:item.data,borderColor:item.color,backgroundColor:item.bg,fill:true,tension:0.35,pointRadius:4,pointHoverRadius:6,borderWidth:2}))},options:JSON.parse(JSON.stringify(baseOpts))});
  const monthTotals=MONTHS.map((_,mi)=>items.reduce((s,item)=>s+(item.data[mi]||0),0));
  const barCtx=document.getElementById(barId).getContext('2d');
  const barGrad=barCtx.createLinearGradient(0,0,0,220);
  barGrad.addColorStop(0,'rgba(99,102,241,0.7)');barGrad.addColorStop(1,'rgba(99,102,241,0.1)');
  chartInstances[barId]=new Chart(barCtx,{type:'bar',data:{labels:MONTHS.map(m=>m.replace('20','').replace('-','/')),datasets:[{label:'전체 합계',data:monthTotals,backgroundColor:barGrad,borderColor:'#6366f1',borderWidth:1,borderRadius:4}]},options:{...JSON.parse(JSON.stringify(baseOpts)),plugins:{...JSON.parse(JSON.stringify(baseOpts)).plugins,legend:{display:false}}}});
  const changeSets=items.map(item=>{const rates=item.data.map((v,i)=>{if(i===0)return null;const prev=item.data[i-1];if(!prev||prev===0)return null;return parseFloat(((v-prev)/prev*100).toFixed(2));});return{label:item.label,data:rates,borderColor:item.color,backgroundColor:'transparent',tension:0.3,pointRadius:3,borderWidth:2,fill:false};});
  const chgOpts=JSON.parse(JSON.stringify(baseOpts));
  chgOpts.scales.y.ticks.callback=v=>v.toFixed(1)+'%';
  chgOpts.plugins.tooltip.callbacks.label=ctx=>` ${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)??'-'}%`;
  const changeCtx=document.getElementById(changeId).getContext('2d');
  chartInstances[changeId]=new Chart(changeCtx,{type:'line',data:{labels:MONTHS.map(m=>m.replace('20','').replace('-','/')),datasets:changeSets},options:chgOpts});
}

function renderChangeTable(items){
  const wrap=document.getElementById('change-table-wrap');
  const lastN=Math.min(MONTHS.length,6),sliceMonths=MONTHS.slice(-lastN);
  let html=`<table class=&quot;change-table&quot;><thead><tr><th>채널/캠페인</th>${sliceMonths.map(m=>`<th>${m.replace('20','').replace('-','/')}</th>`).join('')}</tr></thead><tbody>`;
  items.forEach(item=>{
    html+=`<tr><td style=&quot;color:${item.color};font-weight:600&quot;>${item.label}</td>`;
    sliceMonths.forEach(m=>{
      const mi=MONTHS.indexOf(m),curr=item.data[mi]||0,prevMi=mi-1,prev=prevMi>=0?item.data[prevMi]:null;
      const chg=prev!==null&&prev!==0?((curr-prev)/prev*100):null,val=fmtVal(curr,selectedMetric);
      if(chg!==null){const cls=chg>0.5?'up':chg<-0.5?'down':'flat',arrow=chg>0.5?'▲':chg<-0.5?'▼':'—';html+=`<td>${val}<br><span class=&quot;badge ${cls}&quot;>${arrow}${Math.abs(chg).toFixed(1)}%</span></td>`;}
      else html+=`<td>${val}</td>`;
    });
    html+='</tr>';
  });
  html+='</tbody></table>';
  wrap.innerHTML=html;
}

// ─── INIT ───
function showMainContent(){
  document.getElementById('emptyState').style.display='none';
  document.getElementById('mainContent').style.display='block';
}

function init(){
  if(MONTHS.length){
    showMainContent();
    buildChannelList();buildCampaignList();buildMetricGrid();render();
  }
}

// ─── postMessage HANDLER ───
window.addEventListener('message', function(e) {
  if (!e.data || e.data.type !== 'DETAIL_DATA') return;
  const d = e.data.payload;
  
  // Update data
  MONTHS.length = 0; Array.prototype.push.apply(MONTHS, d.months);
  CHANNELS.length = 0; Array.prototype.push.apply(CHANNELS, d.channels);
  CAMPAIGNS.length = 0; Array.prototype.push.apply(CAMPAIGNS, d.campaigns);
  if (d.metrics) { METRICS.length = 0; Array.prototype.push.apply(METRICS, d.metrics); }
  if (d.rate_metrics) { RATE_METRICS.length = 0; Array.prototype.push.apply(RATE_METRICS, d.rate_metrics); }
  for (const k of Object.keys(CHANNEL_DATA)) delete CHANNEL_DATA[k];
  Object.assign(CHANNEL_DATA, d.channel_data);
  for (const k of Object.keys(CAMPAIGN_DATA)) delete CAMPAIGN_DATA[k];
  Object.assign(CAMPAIGN_DATA, d.campaign_data);
  
  // Reset state
  selectedChannels = new Set(CHANNELS);
  selectedCampaigns = new Set();
  selectedMetric = METRICS[0] || '세션수';
  campaignPanelOpen = false;
  campaignFilterText = '';
  mode = 'channel';
  
  // Reset UI toggles
  document.getElementById('btn-channel').classList.add('active');
  document.getElementById('btn-campaign').classList.remove('active');
  document.getElementById('channel-section').style.display = '';
  document.getElementById('campaign-section').style.display = 'none';
  document.getElementById('camp-switch').classList.remove('on');
  document.getElementById('campaign-panel').classList.remove('visible');
  
  // Destroy charts
  Object.values(chartInstances).forEach(c => { try { c.destroy(); } catch(e){} });
  chartInstances = {};
  
  // Rebuild UI
  showMainContent();
  buildChannelList();
  buildCampaignList();
  buildMetricGrid();
  render();
});

init();
&lt;/script>

<script>
// ===== TAB SWITCHING =====
function showTab(id){
  document.querySelectorAll('iframe').forEach(f=>f.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== DEFAULT RAW CSV DATA =====
// 여기에 RAW CSV 텍스트를 붙여넣으면 페이지 로드 시 자동으로 대시보드에 표시됩니다.
// 비워두면 기본 화면(빈 대시보드)으로 시작합니다.
const DEFAULT_RAW_DATA = [];

// ===== CSV FILE HANDLER =====
let parsedHeaders = [];
let parsedRows = [];

function parseCsvText(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // BOM
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) throw new Error('데이터가 없습니다 (최소 2행 필요)');
  parsedHeaders = splitCsvLine(lines[0]).map(h => h.trim().replace(/^"|"$/g, ''));
  parsedRows = [];
  for (let i = 1; i < lines.length; i++) {
    const vals = splitCsvLine(lines[i]);
    if (vals.length < 2) continue;
    parsedRows.push(vals.map(v => v.trim().replace(/^"|"$/g, '')));
  }
}

// ===== RAW 롱포맷 자동 감지 및 피벗 =====
// 컬럼 구조: Utm Path2 Label(채널), Utm Campaign(캠페인), 측정값 이름, 선택날짜형식, 측정값
const RAW_LONG_FORMAT_HEADERS = ['utm path2 label', 'utm campaign', '측정값 이름', '선택날짜형식', '측정값'];

function isRawLongFormat(headers) {
  const hl = headers.map(h => h.toLowerCase().trim());
  return RAW_LONG_FORMAT_HEADERS.every(req => hl.some(h => h === req));
}

function pivotRawLongFormat(headers, rows) {
  const hl = headers.map(h => h.toLowerCase().trim());
  const iPath2    = hl.indexOf('utm path2 label');
  const iCampaign = hl.indexOf('utm campaign');
  const iMetric   = hl.indexOf('측정값 이름');
  const iDate     = hl.indexOf('선택날짜형식');
  const iValue    = hl.indexOf('측정값');

  // 지표명 → crmData 인덱스 매핑 (인덱스: 0=date,1=path2,2=campaign,3=sess,4=pdp,5=cart,6=checkout,7=orders,8=revenue,9=aov)
  const METRIC_IDX = {
    '세션수': 3, '상품상세세션수': 4, '장바구니세션수': 5,
    '체크아웃세션수': 6, '주문수': 7, '주문금액': 8, '평균주문금액': 9
  };

  // date+path2+campaign 기준으로 집계
  const keyMap = {};
  for (const vals of rows) {
    const date     = vals[iDate]     || '';
    const path2    = vals[iPath2]    || '';
    const campaign = vals[iCampaign] || '';
    const metric   = (vals[iMetric]  || '').trim();
    const value    = parseFloat((vals[iValue] || '0').replace(/,/g, '')) || 0;
    if (!date || !path2 || !campaign) continue;

    const key = `${date}||${path2}||${campaign}`;
    if (!keyMap[key]) keyMap[key] = [date, path2, campaign, 0, 0, 0, 0, 0, 0, 0];
    const idx = METRIC_IDX[metric];
    if (idx !== undefined) keyMap[key][idx] += value;
  }
  return Object.values(keyMap);
}

function tryAutoApply(label) {
  // RAW 롱포맷이면 피벗 후 바로 전송 (모달 없음)
  if (isRawLongFormat(parsedHeaders)) {
    setLoading('RAW 데이터 변환 중...');
    setTimeout(() => {
      try {
        const crmData = pivotRawLongFormat(parsedHeaders, parsedRows);
        if (!crmData.length) throw new Error('유효한 데이터 행이 없습니다.');
        const detailData = buildDetailData(crmData);
        document.getElementById('crm').contentWindow.postMessage({ type:'CRM_DATA', payload:crmData }, '*');
        document.getElementById('detail').contentWindow.postMessage({ type:'DETAIL_DATA', payload:detailData }, '*');
        setStatus(`✓ ${crmData.length}행 로드 완료 · ${[...new Set(crmData.map(r=>r[1]))].length}개 채널 · ${[...new Set(crmData.map(r=>r[2]))].length}개 캠페인`, 'ok');
        hideLoading();
      } catch(err) {
        setStatus('처리 오류: ' + err.message, 'err');
        hideLoading();
      }
    }, 50);
    return true;
  }

  // 일반 와이드포맷: 자동 매핑 시도
  const guess = guessMapping();
  const requiredKeys = FIELD_DEFS.filter(f => f.required).map(f => f.key);
  const allMapped = requiredKeys.every(k => guess[k] !== undefined);
  if (allMapped) {
    const colMap = {};
    for (const f of FIELD_DEFS) {
      colMap[f.key] = guess[f.key] !== undefined ? guess[f.key] : -1;
    }
    setLoading('데이터 변환 중...');
    setTimeout(() => {
      try {
        processData(colMap);
      } catch(err) {
        setStatus('처리 오류: ' + err.message, 'err');
        hideLoading();
      }
    }, 50);
    return true;
  } else {
    hideLoading();
    openMappingModal(label);
    return false;
  }
}

function onFileSelected(input) {
  const file = input.files[0];
  if (!file) return;
  input.value = '';
  setStatus('읽는 중...', 'loading');
  showLoading('CSV 파일 읽는 중...');

  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      parseCsvText(e.target.result);
      tryAutoApply(file.name);
    } catch(err) {
      setStatus('오류: ' + err.message, 'err');
      hideLoading();
    }
  };
  reader.onerror = () => { setStatus('파일 읽기 실패', 'err'); hideLoading(); };
  reader.readAsText(file, 'UTF-8');
}

// 페이지 로드 시 DEFAULT_RAW_DATA가 있으면 자동 로드 (CSV 파싱/매핑 불필요)
window.addEventListener('load', function() {
  if (!DEFAULT_RAW_DATA || !DEFAULT_RAW_DATA.length) return;
  showLoading('기본 데이터 로드 중...');
  setTimeout(() => {
    try {
      const crmData = DEFAULT_RAW_DATA;
      const detailData = buildDetailData(crmData);
      document.getElementById('crm').contentWindow.postMessage({ type:'CRM_DATA', payload:crmData }, '*');
      document.getElementById('detail').contentWindow.postMessage({ type:'DETAIL_DATA', payload:detailData }, '*');
      setStatus(`✓ ${crmData.length}행 로드 완료 · ${[...new Set(crmData.map(r=>r[1]))].length}개 채널 · ${[...new Set(crmData.map(r=>r[2]))].length}개 캠페인`, 'ok');
      hideLoading();
    } catch(err) {
      setStatus('기본 데이터 오류: ' + err.message, 'err');
      hideLoading();
    }
  }, 300);
});

// ===== COLUMN MAPPING MODAL =====
const FIELD_DEFS = [
  { key:'date',     label:'날짜 *',          required:true,  hint:'YYYY-MM-DD 형식' },
  { key:'path2',    label:'채널 (path2) *',   required:true,  hint:'문자메세지, 카카오 알림톡 등' },
  { key:'campaign', label:'캠페인명 *',        required:true,  hint:'캠페인 식별자' },
  { key:'sess',     label:'세션수',            required:false, hint:'' },
  { key:'pdp',      label:'상품상세세션수',    required:false, hint:'' },
  { key:'cart',     label:'장바구니세션수',    required:false, hint:'' },
  { key:'checkout', label:'체크아웃세션수',    required:false, hint:'' },
  { key:'orders',   label:'주문수',            required:false, hint:'' },
  { key:'revenue',  label:'주문금액',          required:false, hint:'' },
  { key:'aov',      label:'평균주문금액',      required:false, hint:'' },
];

const ALIAS_MAP = {
  date:     ['date','날짜','일자','기준일','ymd','yyyymmdd'],
  path2:    ['path2','channel','채널','채널명','channelname','utm_medium','매체'],
  campaign: ['campaign','캠페인','campaign_name','캠페인명','utm_campaign'],
  sess:     ['세션수','session','sessions','sess','유입수','유입세션'],
  pdp:      ['상품상세세션수','pdp','pdp_session','product_detail','상품상세'],
  cart:     ['장바구니세션수','cart','cart_session','장바구니'],
  checkout: ['체크아웃세션수','checkout','checkout_session','체크아웃'],
  orders:   ['주문수','orders','order_count','주문건수'],
  revenue:  ['주문금액','revenue','order_revenue','주문매출','매출','gmv'],
  aov:      ['평균주문금액','aov','avg_order_value','객단가'],
};

function guessMapping() {
  const map = {};
  const hl = parsedHeaders.map(h => h.toLowerCase().replace(/[\s_]/g,''));
  for (const [key, aliases] of Object.entries(ALIAS_MAP)) {
    for (let i = 0; i < parsedHeaders.length; i++) {
      if (aliases.some(a => hl[i] === a.toLowerCase().replace(/[\s_]/g,''))) {
        map[key] = i; break;
      }
    }
  }
  return map;
}

function openMappingModal(filename) {
  const guess = guessMapping();
  const grid = document.getElementById('mappingGrid');
  grid.innerHTML = FIELD_DEFS.map(f => {
    const opts = parsedHeaders.map((h,i) => `<option value="${i}" ${guess[f.key]===i?'selected':''}>${h}</option>`).join('');
    return `<div class="col-row">
      <label class="col-label">${f.label}</label>
      <select class="col-select" id="map_${f.key}">
        <option value="-1">-- 미사용 --</option>
        ${opts}
      </select>
      ${f.hint?`<span style="font-size:10px;color:#4b5563;margin-top:2px;">${f.hint}</span>`:''}
    </div>`;
  }).join('');
  document.getElementById('mappingModal').classList.add('visible');
  document.getElementById('uploadStatus').textContent = `${filename} (${parsedRows.length}행) — 컬럼 매핑 설정 중`;
  document.getElementById('uploadStatus').className = 'upload-status loading';
}

function closeMapping() {
  document.getElementById('mappingModal').classList.remove('visible');
  setStatus('업로드 취소됨', '');
}

function applyMapping() {
  const colMap = {};
  let missingRequired = [];
  for (const f of FIELD_DEFS) {
    const val = parseInt(document.getElementById('map_'+f.key).value);
    colMap[f.key] = val;
    if (f.required && val < 0) missingRequired.push(f.label);
  }
  if (missingRequired.length) {
    alert('필수 컬럼을 선택해주세요:\n' + missingRequired.join(', '));
    return;
  }
  document.getElementById('mappingModal').classList.remove('visible');
  showLoading('데이터 변환 중...');
  setTimeout(() => {
    try {
      processData(colMap);
    } catch(err) {
      setStatus('처리 오류: ' + err.message, 'err');
      hideLoading();
    }
  }, 50);
}


// ===== DATA PROCESSING =====
function num(v) {
  if (v === undefined || v === null || v === '' || v === '-') return 0;
  return parseFloat(String(v).replace(/,/g,'')) || 0;
}

function processData(colMap) {
  // Build CRM row format
  const crmData = [];
  for (const vals of parsedRows) {
    const get = (key) => colMap[key] >= 0 ? (vals[colMap[key]] || '') : '';
    const dateStr = get('date');
    const channel = get('path2');
    const campaign = get('campaign');
    if (!dateStr || !channel || !campaign) continue;
    
    // Normalize date to YYYY-MM-DD
    let normalDate = dateStr;
    if (/^\d{8}$/.test(dateStr)) {
      normalDate = `${dateStr.slice(0,4)}-${dateStr.slice(4,6)}-${dateStr.slice(6,8)}`;
    }
    
    crmData.push([
      normalDate,
      channel,
      campaign,
      num(get('sess')),
      num(get('pdp')),
      num(get('cart')),
      num(get('checkout')),
      num(get('orders')),
      num(get('revenue')),
      num(get('aov')),
    ]);
  }
  
  if (!crmData.length) throw new Error('유효한 데이터 행이 없습니다. 날짜/채널/캠페인 컬럼을 확인해주세요.');
  
  setLoading('차트 업데이트 중...');
  const detailData = buildDetailData(crmData);
  
  // Send to iframes
  document.getElementById('crm').contentWindow.postMessage({ type:'CRM_DATA', payload:crmData }, '*');
  document.getElementById('detail').contentWindow.postMessage({ type:'DETAIL_DATA', payload:detailData }, '*');
  
  setStatus(`✓ ${crmData.length}행 로드 완료 · ${[...new Set(crmData.map(r=>r[1]))].length}개 채널 · ${[...new Set(crmData.map(r=>r[2]))].length}개 캠페인`, 'ok');
  hideLoading();
}

function buildDetailData(rows) {
  const monthSet = new Set(), channelSet = new Set(), campaignSet = new Set();
  for (const r of rows) {
    const d = String(r[0]);
    if (d.length >= 7) monthSet.add(d.substring(0,7));
    if (r[1]) channelSet.add(r[1]);
    if (r[2]) campaignSet.add(r[2]);
  }
  const months = Array.from(monthSet).sort();
  const channels = Array.from(channelSet).sort();
  const campaigns = Array.from(campaignSet).sort();
  
  const METRICS = ['세션수','상품상세세션수','장바구니세션수','체크아웃세션수','주문수','주문금액','평균주문금액','유입比 주문전환율','상세比 주문전환율','상품상세전환율'];
  const RATE_METRICS = ['평균주문금액','유입比 주문전환율','상세比 주문전환율','상품상세전환율'];
  
  function makeEmpty() { return months.map(() => ({sess:0,pdp:0,cart:0,checkout:0,orders:0,revenue:0})); }
  const chAgg = {}, campAgg = {};
  for (const ch of channels) chAgg[ch] = makeEmpty();
  for (const c of campaigns) campAgg[c] = makeEmpty();
  
  for (const r of rows) {
    const monthKey = String(r[0]).substring(0,7);
    const mi = months.indexOf(monthKey);
    if (mi < 0) continue;
    const ch = r[1], camp = r[2];
    const add = (obj, key) => {
      obj[key][mi].sess     += r[3]; obj[key][mi].pdp      += r[4];
      obj[key][mi].cart     += r[5]; obj[key][mi].checkout += r[6];
      obj[key][mi].orders   += r[7]; obj[key][mi].revenue  += r[8];
    };
    if (ch && chAgg[ch]) add(chAgg, ch);
    if (camp && campAgg[camp]) add(campAgg, camp);
  }
  
  function buildMetrics(agg) {
    const out = {};
    for (const [key, monthArr] of Object.entries(agg)) {
      out[key] = {
        '세션수':           monthArr.map(m => m.sess),
        '상품상세세션수':   monthArr.map(m => m.pdp),
        '장바구니세션수':   monthArr.map(m => m.cart),
        '체크아웃세션수':   monthArr.map(m => m.checkout),
        '주문수':           monthArr.map(m => m.orders),
        '주문금액':         monthArr.map(m => m.revenue),
        '평균주문금액':     monthArr.map(m => m.orders > 0 ? m.revenue/m.orders : 0),
        '유입比 주문전환율': monthArr.map(m => m.sess > 0 ? m.orders/m.sess : 0),
        '상세比 주문전환율': monthArr.map(m => m.pdp > 0 ? m.orders/m.pdp : 0),
        '상품상세전환율':   monthArr.map(m => m.sess > 0 ? m.pdp/m.sess : 0),
      };
    }
    return out;
  }
  
  return { months, channels, campaigns, metrics:METRICS, rate_metrics:RATE_METRICS,
           channel_data:buildMetrics(chAgg), campaign_data:buildMetrics(campAgg) };
}

// ===== CSV PARSE HELPER =====
function splitCsvLine(line) {
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { if (inQ && line[i+1]==='"') { cur+='"'; i++; } else inQ=!inQ; }
    else if (c === ',' && !inQ) { result.push(cur); cur = ''; }
    else cur += c;
  }
  result.push(cur);
  return result;
}

// ===== UI HELPERS =====
function setStatus(msg, cls) {
  const el = document.getElementById('uploadStatus');
  el.textContent = msg;
  el.className = 'upload-status' + (cls ? ' '+cls : '');
}
function showLoading(msg) {
  document.getElementById('loadingText').textContent = msg;
  document.getElementById('loadingOverlay').classList.add('visible');
}
function setLoading(msg) { document.getElementById('loadingText').textContent = msg; }
function hideLoading() { document.getElementById('loadingOverlay').classList.remove('visible'); }
</script>
